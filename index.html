<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="./城市折算规则优化/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海外中位薪城市折算</title>
  <link rel="stylesheet" href="assets/unpkg.com/ant-design-vue@4.2.6/dist/reset.css" />
  <!-- 原型说明: antd 的 UMD 包在全局分支下依赖下列 dayjs 插件全局变量，缺失会导致 antd is not defined；顺序不可调整 -->
  <link rel="stylesheet" href="prototype.css" />
  <!-- 原型说明: Vue3 / Ant Design Vue4 的本地CDN副本；遵循已确认的系统组件与布局。 -->
</head>
<body>
<div id="app"></div>
  <div id="boot-state" role="status" aria-live="polite" style="padding:80px 10%;font:12px sans-serif;color:#666">
    <div style="height:30px;width:240px;background:#e8eef9;border-radius:6px;margin-bottom:24px"></div>
    <p id="boot-message">正在加载页面，请稍候…</p>
    <div style="height:120px;background:#f5f7fd;border-radius:8px;margin:24px 0"></div>
    <div style="height:240px;background:#f5f7fd;border-radius:8px;margin-bottom:16px"></div>
    <a id="boot-retry" href="" style="display:none;color:#0E66FB" onclick="location.reload();return false">重新加载</a>
  </div>
<script>
  function showBootRetry(text) {
    if (!document.getElementById('boot-state')) return;
    document.getElementById('boot-message').textContent = text;
    document.getElementById('boot-retry').style.display = 'inline';
  }
  setTimeout(() => showBootRetry('加载较慢，请稍候或重新加载。'), 15000);
  window.addEventListener('error', () => showBootRetry('页面加载失败，请重新加载。'), true);
</script>

<script type="text/x-template" id="page-tpl">
<a-config-provider :locale="zhCN" :theme="theme">
  <header class="layout-header header">
    <div class="header-left"><a class="layout-logo" href="index.html"><span class="logo-text">HRONE</span></a></div>
    <div class="header-history"><span class="history-tag is-active">海外中位薪城市折算</span></div>
    <div class="header-right"><span style="color:#888">预算管理</span></div>
  </header>
  <div class="layout-content">
    <aside class="layout-left"><div class="layout-menu">
      <div class="menu-group-title">预算管理</div>
      <a class="menu-item" href="../海外薪酬中位值/index.html" target="_blank" rel="noopener">海外薪酬中位值</a>
      <a class="menu-item is-active" href="index.html" aria-current="page">海外中位薪城市折算</a>
    </div></aside>
    <main class="layout-right">
      <div class="layout-view"><a-tabs class="layout-tabs" size="small" type="card" active-key="page"><a-tab-pane key="page" tab="海外中位薪城市折算" /></a-tabs></div>
      <div class="layout-view-main pulic-table-box">

<a-alert v-if="fatal" type="error" :message="fatal" class="preview-error" show-icon />
<a-card class="pulic-table-search-form card-shadow" size="small" :bordered="false">
  <template #title><span class="search-card-title"><i-filter /> 查询条件</span></template>
  <a-form class="my-search-form vertical" layout="vertical" :model="filters" @finish="search">
    <div class="item-group-up">
      <a-form-item label="二级部门">
        <!-- 对应 DeptTreeSelect；field-names及样式沿用skill -->
        <a-tree-select v-model:value="filters.department" class="org-tree-module org-tree" :tree-data="departmentOptions" :field-names="departmentFieldNames" tree-node-filter-prop="name" multiple show-search allow-clear placeholder="请选择二级部门" />
      </a-form-item>
      <a-form-item label="国家">
        <!-- 对应 MySelect；本地国家字典 -->
        <a-select v-model:value="filters.country" class="my-select" :options="countryOptions" mode="multiple" show-search allow-clear option-filter-prop="label" placeholder="请选择国家" />
      </a-form-item>
      <a-form-item label="启用状态">
        <!-- 对应 DictSelect；启用状态mock -->
        <a-select v-model:value="filters.status" class="my-dict-select" :options="statusOptions" mode="multiple" allow-clear placeholder="全部" />
      </a-form-item>
    </div>
    <div class="search-action"><a-button @click="reset"><template #icon><i-reload /></template>重置</a-button><a-button type="primary" html-type="submit"><template #icon><i-search /></template>查询</a-button></div>
  </a-form>
</a-card>
<section class="table-main card-shadow">
  <div class="table-toolBox">
    <div class="selection-count"><template v-if="selected.length">已选 {{ selected.length }} 项<a-button type="link" size="small" class="selection-clear" @click="selected = []">清空</a-button></template></div>
    <div class="toolBox-right">
      <a-button type="primary" @click="openNew"><template #icon><i-plus /></template>新增折算方案</a-button>
      <a-button v-if="selected.length >= 2" @click="execute(selected)"><template #icon><i-reload /></template>批量执行刷新</a-button>
      <a-tooltip title="列设置"><button class="column-placeholder" type="button" aria-label="列设置"><i-setting /></button></a-tooltip>
    </div>
  </div>
  <!-- 对应 dynamic-table；配置摘要与执行时间，复选框用于批量执行 -->
  <proto-table :columns="columns" :data-source="visibleRules" :pagination="pagination" :row-selection="selection" row-key="id" :scroll="{x:tableWidth}" @change="changePage">
    <template #bodyCell="{column,record}">
      <template v-if="column.key === 'country'">{{ countryName(record.country) }}</template>
      <template v-else-if="column.key === 'baseline'">{{ record.baseline || '国家标准' }}</template>
      <template v-else-if="column.key === 'status'"><a-badge :status="record.enabled ? 'success' : 'default'" :text="record.enabled ? '启用' : '停用'" /></template>
      <template v-else-if="column.key === 'tiers'"><span class="tier-summary">{{ record.tiers.map(tier => tier.name + '：' + formatFactor(tier.factor)).join('；') || '--' }}</span></template>
      <template v-else-if="column.key === 'editedAt' || column.key === 'executedAt'"><span class="number">{{ formatTime(record[column.key]) }}</span></template>
      <template v-else-if="column.key === 'action'">
        <a-tooltip title="编辑"><button class="table-icon-btn" type="button" :aria-label="'编辑 · ' + record.department + ' · ' + countryName(record.country)" @click="openEdit(record)"><i-edit /></button></a-tooltip>
        <a-tooltip v-if="record.enabled" title="执行刷新"><button class="table-icon-btn" type="button" :aria-label="'执行刷新 · ' + record.department + ' · ' + countryName(record.country)" @click="execute([record.id])"><i-reload /></button></a-tooltip>
        <a-tooltip :title="record.enabled ? '停用' : '启用'"><button class="table-icon-btn" :class="record.enabled ? 'is-danger' : 'is-success'" type="button" :aria-label="(record.enabled ? '停用' : '启用') + ' · ' + record.department + ' · ' + countryName(record.country)" @click="changeStatus(record)"><i-stop v-if="record.enabled" /><i-play v-else /></button></a-tooltip>
        <a-tooltip v-if="!record.enabled" title="删除"><button class="table-icon-btn is-danger" type="button" :aria-label="'删除 · ' + record.department + ' · ' + countryName(record.country)" @click="deleteRule(record)"><i-delete /></button></a-tooltip>
      </template>
    </template>
  </proto-table>
</section>

      </div>
    </main>
  </div>

<a-modal v-if="draft" :open="true" class="custom-modal rule-modal" :title="!editingId ? '新增城市折算规则' : '配置城市折算规则'" :width="800"
      :mask-closable="false" ok-text="保存" cancel-text="取消" @ok="saveDraft" :confirm-loading="saving" @cancel="draft = null">
      <div class="overview-row">
        <div>
          <span class="field-label" id="department-label"><span class="field-error">*</span> 二级部门</span>
          <!-- 对应 DeptTreeSelect；新增可选，编辑回显且禁用 -->
          <a-tree-select id="editor-department" v-model:value="draft.department" @change="changeScope" class="org-tree-module org-tree department-select"
            :tree-data="departmentOptions" :field-names="departmentFieldNames" tree-node-filter-prop="name"
            aria-labelledby="department-label" placeholder="请选择二级部门" show-search :disabled="!!editingId"
            :status="errors.department ? 'error' : undefined" />
          <div v-if="errors.department" class="field-error" role="alert">{{ errors.department }}</div>
        </div>
        <div>
          <span class="field-label" id="country-label"><span v-if="!editingId" class="field-error">*</span> 国家</span>
          <a-select v-if="!editingId" id="editor-country" class="country-select" :value="draft.country" :options="editorCountries"
            aria-labelledby="country-label" placeholder="请选择国家" option-filter-prop="label" show-search
            :status="errors.country ? 'error' : undefined" @change="changeCountry" />
          <a-select v-else id="editor-country" class="country-select" :value="draft.country" disabled aria-labelledby="country-label"
            :options="[{ value: draft.country, label: countryName(draft.country) + ' ' + draft.country }]" />
          <div v-if="errors.country" class="field-error" role="alert">{{ errors.country }}</div>
        </div>
        <div><span class="field-label" id="enabled-label">启用城市折算</span>
          <div class="enabled-control">
            <a-switch v-model:checked="draft.enabled" aria-labelledby="enabled-label" />
            <span>{{ draft.enabled ? '已启用' : '未启用' }}</span>
          </div>
        </div>
      </div>
      <div class="base-city-field">
        <span class="field-label" id="base-city-label">基准城市</span>
        <div class="base-city-control">
          <!-- 对应 MySelect；本国城市单选，空值代表国家标准 -->
          <a-select id="editor-baseline" v-model:value="draft.baseline" class="my-select" :options="baseCities" show-search allow-clear
            option-filter-prop="label" aria-labelledby="base-city-label" :disabled="!draft.country"
            :placeholder="draft.country ? '请选择基准城市（可为空）' : '请先选择国家'" />
          <span class="field-help">以某个城市作为折算基准，若为空，则以国家标准为基准。</span>
        </div>
        <div v-if="errors.baseline" class="field-error" role="alert">{{ errors.baseline }}。<a href="../海外薪酬中位值/index.html" target="_blank" rel="noopener">查看当前海外薪酬中位值</a></div>
      </div>
      <div class="modal-section">
        <h2 class="section-title">城市档位与折算系数</h2>
        <div class="rule-list-actions">
          <a-button size="small" :disabled="!draft.country" @click="addTier"><template #icon><i-plus /></template>新增档位</a-button>
        </div>
      </div>
      <p v-if="!draft.country" class="field-help" style="margin:0 0 10px">请先选择国家，再配置档位、系数和城市。</p>
      <table class="tier-table">
        <thead><tr><th scope="col"><span class="field-error">*</span> 档位名称</th><th scope="col"><span class="field-error">*</span> 折算系数</th><th scope="col"><span class="field-error">*</span> 适用城市</th><th scope="col">操作</th></tr></thead>
        <tbody>
          <tr v-for="(tier, index) in draft.tiers" :key="tier.uid">
            <td>
              <!-- 对应 MyInput；档位名称可编辑 -->
              <a-input v-model:value="tier.name" class="my-input-components" :id="'tier-name-' + tier.uid"
                :aria-label="'第' + (index + 1) + '行档位名称'" placeholder="请输入档位名称" :disabled="!draft.country"
                :status="errors['name' + index] ? 'error' : undefined" />
              <div v-if="errors['name' + index]" class="field-error">{{ errors['name' + index] }}</div>
            </td>
            <td>
              <a-input-number v-model:value="tier.factor" :step="0.01" placeholder="请输入"
                :aria-label="'第' + (index + 1) + '行折算系数'" :disabled="!draft.country"
                :status="errors['factor' + index] ? 'error' : undefined" />
              <div v-if="errors['factor' + index]" class="field-error" role="alert">{{ errors['factor' + index] }}</div>
            </td>
            <td>
              <!-- 对应多选下拉 a-select；按当前国家筛选工作城市 -->
              <a-select v-model:value="tier.cities" mode="multiple" show-search allow-clear
                :aria-label="'第' + (index + 1) + '行适用城市'" :disabled="!draft.country" option-filter-prop="label" :placeholder="draft.country ? '请选择适用城市' : '请先选择国家'"
                :status="errors['cities' + index] ? 'error' : undefined"
                :options="cityOptions(tier)" />
              <div v-if="errors['cities' + index]" class="field-error">{{ errors['cities' + index] }}</div>
            </td>
            <td>
              <div class="tier-actions">
                <a-tooltip title="上移档位">
                  <span><button type="button" class="table-icon-btn" :aria-label="'上移第' + (index + 1) + '行档位'"
                    :disabled="!draft.country || index === 0" @click="moveTier(index, -1)"><i-arrow-up /></button></span>
                </a-tooltip>
                <a-tooltip title="下移档位">
                  <span><button type="button" class="table-icon-btn" :aria-label="'下移第' + (index + 1) + '行档位'"
                    :disabled="!draft.country || index === draft.tiers.length - 1" @click="moveTier(index, 1)"><i-arrow-down /></button></span>
                </a-tooltip>
                <a-tooltip v-if="draft.tiers.length > 1" title="删除档位">
                  <button type="button" class="table-icon-btn is-danger" :aria-label="'删除第' + (index + 1) + '行档位'" @click="removeTier(tier)"><i-delete /></button>
                </a-tooltip>
              </div>
            </td>
          </tr>
          <tr v-if="!draft.tiers.length"><td colspan="4" style="text-align:center" class="muted">暂无档位，请点击“新增档位”</td></tr>
        </tbody>
      </table>
      <div v-if="errors.tiers" class="field-error" role="alert">{{ errors.tiers }}</div>
    </a-modal>

<execution-preview v-if="previewIds" :ids="previewIds" @cancel="previewIds = null" @success="finishExecution" />
</a-config-provider>
</script>

<script type="text/x-template" id="preview-tpl">
<!-- 原型说明: 复用系统a-modal/custom-modal；用户已确认预览以90vw大弹框承载。 -->
<a-modal :open="true" title="执行刷新预览" class="custom-modal execution-preview" width="90vw" :style="{top:'4vh',paddingBottom:0}" :mask-closable="false" :closable="!busy" :keyboard="!busy" @cancel="back">
  <div v-if="snapshot" class="preview-summary">本次 {{ snapshot.rules.length }} 个方案：新增 {{ snapshot.counts.added }} 条，更新 {{ snapshot.counts.updated }} 条<template v-if="snapshot.counts.unchanged">，不变 {{ snapshot.counts.unchanged }} 条</template><template v-if="snapshot.retained.length">，保留原值 {{ snapshot.retained.length }} 条</template></div>
<a-card class="pulic-table-search-form card-shadow" size="small" :bordered="false">
  <template #title><span class="search-card-title"><i-filter /> 查询条件</span></template>
  <a-form class="my-search-form vertical" layout="vertical" :model="filters" @finish="search">
    <div class="item-group-up">
      <a-form-item label="二级部门"><!-- 对应 DeptTreeSelect；选项限本次方案 --><a-tree-select v-model:value="filters.department" class="org-tree-module org-tree" :tree-data="departmentOptions" :field-names="departmentFieldNames" tree-node-filter-prop="name" show-search allow-clear placeholder="全部" /></a-form-item>
      <a-form-item label="国家"><a-select v-model:value="filters.country" class="my-select" :options="countryOptions" show-search allow-clear option-filter-prop="label" placeholder="全部" /></a-form-item>
      <a-form-item label="地区"><a-select v-model:value="filters.region" class="my-select" :options="regionOptions" show-search allow-clear option-filter-prop="label" placeholder="全部" /></a-form-item>
    </div>
    <div class="search-action"><a-button @click="reset"><template #icon><i-reload /></template>重置</a-button><a-button type="primary" html-type="submit"><template #icon><i-search /></template>查询</a-button></div>
  </a-form>
</a-card>
<a-alert v-if="error" type="error" class="preview-error" show-icon>
  <template #message>{{ error }}</template><template #description><ul v-if="errorDetails.length" class="error-details"><li v-for="item in errorDetails" :key="item">{{ item }}</li></ul><a href="../海外薪酬中位值/index.html" target="_blank" rel="noopener">查看当前海外薪酬中位值</a></template>
</a-alert>
<template v-if="snapshot">
  <a-alert v-if="snapshot.retained.length" class="preview-warning" type="warning" show-icon><template #message>{{ snapshot.retained.length }}条现有记录缺少对应基准，将保留原值，不参与刷新。 <a href="../海外薪酬中位值/index.html" target="_blank" rel="noopener">查看当前海外薪酬中位值</a></template></a-alert>
</template>
<section class="table-main card-shadow">
  <a-tabs v-model:active-key="tab" class="preview-tabs" @change="page = 1">
    <template #rightExtra><div class="preview-toolbar"><a-button :loading="refreshing" :disabled="busy || !ids.length" @click="refresh"><template #icon><i-reload /></template>刷新预览</a-button><a-button :loading="exporting" :disabled="!snapshot || !!error || busy || exporting" @click="exportExcel"><template #icon><i-download /></template>导出 Excel</a-button></div></template>
    <a-tab-pane key="generated" :tab="'折算明细(' + (snapshot?.records.length || 0) + ')'" />
    <a-tab-pane v-if="snapshot?.retained.length" key="retained" :tab="'保留原值(' + snapshot.retained.length + ')'" />
  </a-tabs>
  <!-- 对应 dynamic-table；生成与保留集合完整分页，不含对比或操作列 -->
  <proto-table :columns="columns" :data-source="filteredRows" :pagination="pagination" row-key="key" :scroll="{x:2200,y:'max(100px, calc(92vh - 510px))'}" @change="changePage">
    <template #bodyCell="{column,record,text}"><template v-if="amountFields.includes(column.key)">{{ money(text,record.salaryCurrency) }}</template><template v-else>{{ text == null || text === '' ? '--' : text }}</template></template>
  </proto-table>
</section>
<template #footer><a-button :disabled="busy" @click="back">取消</a-button><a-tooltip :title="snapshot && !snapshot.records.length ? '暂无可刷新记录' : ''"><span><a-button type="primary" :loading="busy" :disabled="!snapshot || !!error || !snapshot.records.length || refreshing" @click="confirm">确认刷新</a-button></span></a-tooltip></template>

</a-modal>
</script>
<script defer src="assets/vendor.159e6ddd8b26.js"></script>
<script defer src="../海外薪酬中位值/data.js"></script>
<script defer src="app.6ad3bc509f1e.js"></script>
</body>
</html>
